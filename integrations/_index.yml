# Lovisa integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in lovisa-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: lovisa-shopify
  label: Shopify
  partner: shopify
  partner_name: Shopify
  type: claimed
  evidence: 'https://www.lovisa.com/llms.txt: "This store is built on [Shopify](https://www.shopify.com)"; tools/list
    search_catalog: "Search for products from the online store, hosted on Shopify."'
  source: edge
  relationship: core-infrastructure
  status: not-a-workflow
  arazzo: null
- slug: lovisa-google-pay
  label: Google Pay
  partner: google-pay
  partner_name: Google Pay
  type: contract
  evidence: https://www.lovisa.com/.well-known/ucp payment_handlers "com.google.pay" (id gpay, version 2026-01-11,
    merchant_name "Lovisa United States", gateway "shopify")
  source: edge
  relationship: payment-method
  status: not-a-workflow
  arazzo: null
- slug: lovisa-shop-pay
  label: Shop Pay
  partner_name: Shop Pay
  type: claimed
  evidence: 'https://www.lovisa.com/llms.txt: "use Shop Pay with prefilled addresses and saved payment methods."'
  source: edge
  relationship: payment-method
  status: not-a-workflow
  arazzo: null
