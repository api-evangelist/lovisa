aid: lovisa

name: Lovisa

description: 'Lovisa (Lovisa Holdings, ASX code: LOV) is an Australian fast-fashion jewellery retailer established
  in April 2010, selling affordable, on-trend earrings, necklaces, wristwear, rings and piercing services through
  more than 900 stores in over 45 countries and its Shopify-based online store at lovisa.com. Its site publishes
  an investor centre, a style blog, careers and ambassador programs; no public developer API, API documentation
  or developer portal was found on its own domains. Surfaced via the API Evangelist harvest backlog (source:
  australia-apidays-2026).'

