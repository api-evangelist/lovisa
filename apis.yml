apis:
- aid: lovisa:lovisa-ucp-shopping-mcp
  name: Lovisa UCP Shopping MCP
  description: Universal Commerce Protocol (UCP) shopping service for Lovisa's Shopify-hosted online store,
    advertised in https://www.lovisa.com/llms.txt and the store's /.well-known/ucp profile. An MCP (JSON-RPC)
    endpoint for product discovery, carts, checkout and orders; an anonymous tools/list on 2026-10-21 returned
    13 tools (search_catalog, lookup_catalog, get_product, create_cart/get_cart/update_cart/cancel_cart,
    create_checkout/get_checkout/update_checkout/complete_checkout/cancel_checkout, get_order). The protocol
    is Shopify's platform implementation of UCP (serverInfo universal-commerce 0.1.0), not a Lovisa-authored
    REST API; no OpenAPI, AsyncAPI, GraphQL, gRPC or WSDL contract is published by Lovisa.
  humanURL: https://www.lovisa.com/llms.txt
  baseURL: https://www.lovisa.com/api/ucp/mcp
  tags:
  - MCP
  - Commerce
  - Checkout
  - UCP
  properties:
  - type: Documentation
    url: https://www.lovisa.com/llms.txt
  - type: JSONSchema
    name: MCP tools/list response (live, verbatim, 2026-10-21)
    url: json-schema/lovisa-ucp-mcp-tools-list.json
  - type: Documentation
    name: UCP profile
    url: https://www.lovisa.com/.well-known/ucp
  - type: Documentation
    name: UCP MCP endpoint (Shopify store host named in the UCP profile)
    url: https://lovisa-usa.myshopify.com/api/ucp/mcp

